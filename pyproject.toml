# Tool configuration only (dependencies live in requirements*.txt).

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["_reference", "models", "saved_file", "staticfiles", "src/**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "BLE", "RUF"]
# Django declares class-level lists/dicts by design (Meta.fields, REQUIRED_FIELDS, ...).
ignore = ["RUF012"]
# The en dash is the agreed placeholder for a missing thesis F1 value.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and throwaway test passwords
"scripts/**" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src", "scripts"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # STATIC_ROOT only exists after collectstatic (Docker image / production).
    "ignore:No directory at:UserWarning:django.core.handlers.base",
    # balinese-nlp 2.4.2 uses importlib.resources.path() when loading its data files.
    "ignore:path is deprecated:DeprecationWarning:balinese_nlp",
]
markers = [
    "model: needs pretrained pickles in PRETRAINED_MODELS_DIR (skipped when the folder is missing)",
]
