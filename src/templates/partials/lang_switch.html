{% load i18n %}{% get_current_language as LANGUAGE_CODE %}{% get_language_info_list for LANGUAGES as languages %}
<form action="{% url 'accounts:set_language' %}" method="post" role="group" aria-label="{% translate 'Interface language' %}" class="flex gap-2">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  {% for language in languages %}
    <button type="submit" name="language" value="{{ language.code }}" lang="{{ language.code }}" class="btn"
            aria-pressed="{% if language.code == LANGUAGE_CODE %}true{% else %}false{% endif %}">{{ language.name_local|capfirst }}</button>
  {% endfor %}
</form>
