{% if messages %}
  <div class="grid gap-2" role="status">
    {% for message in messages %}
      <p class="alert {% if message.level_tag == 'error' %}alert--danger{% elif message.level_tag == 'success' %}alert--success{% elif message.level_tag == 'warning' %}alert--warning{% else %}alert--info{% endif %}">{{ message }}</p>
    {% endfor %}
  </div>
{% endif %}
