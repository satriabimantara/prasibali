# Production stack for the VPS (docs/deploy.md). Values come from .env next to this file; nothing secret is here.
#   docker compose -f docker-compose.prod.yml up -d --build
name: prasibali-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    image: prasibali-web:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # ./models is the pretrained-models folder itself (classifier pickles, label encoder, FastText 300).
      PRETRAINED_MODELS_DIR: /app/models
      HF_HOME: /app/.cache/huggingface
      BALINESE_NLP_WORK_DIR: /app/var
      ANALYSIS_WARM_ON_START: "true"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    volumes:
      - ./models:/app/models:ro
      - hf_cache:/app/.cache/huggingface
    # Measured in docs/deploy.md ("Memori dan jumlah worker").
    mem_limit: ${WEB_MEM_LIMIT:-6g}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env, e.g. prasibali.ai}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT: ${BACKUP_AT:-02:00}
      TZ: Asia/Makassar
    volumes:
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
  caddy_data:
  caddy_config:
